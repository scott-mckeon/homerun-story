async function open(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
try{localStorage.setItem('hr-pw',pw)}catch(e){}
document.open();document.write(t);document.close();}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();document.getElementById('e').textContent='';
